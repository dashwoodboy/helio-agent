# Helio Agent packaging. Builds are unsigned (documented): macOS users
# right-click → Open past Gatekeeper, Windows users choose "Run anyway"
# on SmartScreen. Code signing can be added later without config changes.
appId: eu.helio-power.agent
productName: Helio Agent
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
icon: resources/icon.png

# Stable artifact names so the website's download links never change.
mac:
  artifactName: HelioAgent.${ext}
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.utilities
  extendInfo:
    # Recent macOS prompts for Local Network access; without this string the
    # prompt never appears and discovery silently fails.
    NSLocalNetworkUsageDescription: >-
      Helio Agent scans your local network to find your solar inverter's
      Solarman logger stick.

win:
  artifactName: HelioAgent-Setup.${ext}
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false

linux:
  artifactName: HelioAgent.${ext}
  # x64 — what Linux desktops run. ARM boards (Raspberry Pi) use the
  # architecture-independent CLI bundle instead.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  maintainer: David Lourenço
